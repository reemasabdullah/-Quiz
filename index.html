<style>
/* Layout: one narrow reading column, sticky progress strip, numbered question cards, result panel at the end */
:root {
  --bg: #f1f5f6;
  --surface: #ffffff;
  --ink: #17323a;
  --muted: #566c74;
  --line: #d3dfe3;
  --accent: #1f6f7a;
  --accent-ink: #ffffff;
  --accent-soft: #dcecef;
  --ok: #1b7a4b;
  --ok-soft: #dff2e8;
  --bad: #b4442f;
  --bad-soft: #f8e3de;
  --logo-bg: transparent;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b1f; --surface: #162a30; --ink: #e4eef0; --muted: #98b1b8; --line: #2a4249;
    --accent: #5cb8c4; --accent-ink: #0c1d21; --accent-soft: #1d3a41;
    --ok: #5cc58f; --ok-soft: #173a2a; --bad: #f08a72; --bad-soft: #40211b;
    --logo-bg: rgba(255,255,255,.92);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b1f; --surface: #162a30; --ink: #e4eef0; --muted: #98b1b8; --line: #2a4249;
  --accent: #5cb8c4; --accent-ink: #0c1d21; --accent-soft: #1d3a41;
  --ok: #5cc58f; --ok-soft: #173a2a; --bad: #f08a72; --bad-soft: #40211b;
  --logo-bg: rgba(255,255,255,.92);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 640px; margin: 0 auto; }
.head { padding-block: 28px 8px; }
.eyebrow { font-size: 13px; letter-spacing: .04em; color: var(--accent); font-weight: 600; margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 18px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.by { font-size: 9px; letter-spacing: .03em; color: var(--muted); margin: 0; line-height: 1.4; }
.logo { display: block; height: 56px; width: auto; max-width: 50%; background: none; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted);
}
.track { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.count { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: end; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 16px 16px; margin-bottom: 14px; min-width: 0;
}
.card.is-ok { border-color: var(--ok); }
.card.is-bad { border-color: var(--bad); }
.qhead { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 4px; }
.num {
  flex: none; width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  display: grid; place-items: center; line-height: 1;
}
.qtext { margin: 0; font-weight: 600; font-size: 17px; line-height: 1.65; min-width: 0; }
.hint { color: var(--muted); font-size: 13.5px; margin: 2px 0 12px 0; padding-inline-start: 44px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.hint + .opts, .hint + .order { margin-top: 0; }
.opt {
  position: relative; display: flex; gap: 12px; align-items: center;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px;
  cursor: pointer; background: var(--surface); min-width: 0;
}
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt .mark {
  flex: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%;
  display: grid; place-items: center;
}
.opt.multi .mark { border-radius: 6px; }
.opt .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .12s; }
.opt.multi .mark::after { border-radius: 3px; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .mark { border-color: var(--accent); }
.opt:has(input:checked) .mark::after { transform: scale(1); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.locked .opt { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mark { border-color: var(--ok); }
.opt.right .mark::after { background: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .mark { border-color: var(--bad); }
.opt.wrong .mark::after { background: var(--bad); }

.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); margin-inline: 4px; text-align: center; color: var(--accent); font-weight: 600; }

.order { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.slot {
  display: flex; align-items: center; gap: 10px; width: 100%; font: inherit; color: var(--ink);
  border: 1.5px dashed var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px;
  background: transparent; text-align: start; cursor: pointer;
}
.slot .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.slot.filled .n { background: var(--accent); color: var(--accent-ink); }
.slot .end { margin-inline-start: auto; font-size: 12px; color: var(--muted); }
.slot.right { border-color: var(--ok); background: var(--ok-soft); }
.slot.right .n { background: var(--ok); color: #fff; }
.slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.slot.wrong .n { background: var(--bad); color: #fff; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--accent);
  border-radius: 99px; padding: 6px 16px; cursor: pointer;
}
.chip[disabled] { opacity: .35; cursor: default; border-color: var(--line); }
.slot:focus-visible, .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.locked .slot, .locked .chip { cursor: default; }

.fb { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb b { font-weight: 600; }

.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn {
  font: inherit; font-family: var(--font-display); font-weight: 500; font-size: 16px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
  padding: 13px 20px; cursor: pointer; width: 100%;
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.warn { margin: 0; color: var(--bad); font-size: 14.5px; min-height: 1.5em; }

.result { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 22px 18px; margin-top: 20px; text-align: center; }
.result .who { margin: 0; font-size: 14px; opacity: .85; }
.result .score { font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 1.2; margin: 4px 0; font-variant-numeric: tabular-nums; }
.result .msg { margin: 0 0 4px; font-weight: 500; }
.result .when { margin: 0; font-size: 13px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { .fill, .opt .mark::after { transition: none; } }
</style>

    <p class="sub">٨ أسئلة قصيرة على السلايدات. أجيبي عن كل سؤال ثم اضغطي «تحقق من إجاباتي».</p>
  </header>

  <div class="bar" aria-live="polite">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">٠ من ٨</span>
  </div>

  <main id="qs"></main>

  <div class="actions">
    <p class="warn" id="warn" role="alert"></p>
    <button class="btn" id="check" type="button">تحقق من إجاباتي</button>
    <button class="btn ghost" id="retry" type="button" hidden>حاولي مرة أخرى</button>
  </div>

  <section class="result" id="result" hidden aria-live="polite">
    <p class="who" id="who"></p>
    <p class="score" id="score"></p>
    <p class="msg" id="msg"></p>
    <p class="when" id="when"></p>
  </section>
</div>

<script>
(function () {
  var AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function ar(n) { return String(n).replace(/\d/g, function (d) { return AR[d]; }); }

  var Q = [
    { type: 'single', q: 'تُعدّ واجبات الموظف العام العمود الفقري لـ:',
      opts: ['النظام الصحي', 'النظام الإداري الحكومي', 'النظام التعليمي'], ans: [1],
      note: 'واجبات الموظف العام هي العمود الفقري للنظام الإداري الحكومي بأكمله.' },
    { type: 'multi', q: 'اختاري ثلاثة من واجبات الموظف العام الأساسية.', hint: 'اختاري ٣ إجابات',
      opts: ['الالتزام بالأنظمة واللوائح', 'قبول الهدايا مقابل تسهيل عمل', 'المحافظة على المال العام',
             'استخدام المعلومات الوظيفية لأغراض تجارية', 'احترام النظام الإداري'], ans: [0, 2, 4],
      note: 'الواجبات الأساسية: الالتزام بالأنظمة، والمحافظة على المال العام، واحترام النظام الإداري.' },
    { type: 'single', q: 'الواجبات الإيجابية هي ما يُطلب من الموظف القيام به لتحقيق التميز والارتقاء بمستوى الخدمة.',
      opts: ['صح', 'خطأ'], ans: [0],
      note: 'العبارة صحيحة، فالواجبات الإيجابية تركز على الإنجاز والتطوير المستمر.' },
    { type: 'single', q: 'يُمنع على الموظف قبول أي ____ أو رشاوى من أي شخص له مصلحة في عمله.', blank: true,
      opts: ['إجازات', 'هدايا', 'ترقيات'], ans: [1],
      note: 'يُمنع قبول الهدايا أو المزايا أو الرشاوى من أي شخص له مصلحة في عمل الموظف.' },
    { type: 'multi', q: 'اختاري مثالين على استغلال النفوذ الوظيفي المحظور.', hint: 'اختاري إجابتين',
      opts: ['تفضيل معاملة شخصية على حساب الآخرين', 'الحضور في الوقت المحدد',
             'التوسط لدى جهات أخرى بحكم الوظيفة', 'المشاركة في الدورات التدريبية'], ans: [0, 2],
      note: 'من أمثلة الاستغلال المحظور: تفضيل معاملة شخصية، والتوسط لدى جهات أخرى بحكم الوظيفة.' },
    { type: 'order', q: 'رتّبي العقوبات التأديبية من الأخف إلى الأشد.', hint: 'اضغطي على العقوبات بالترتيب. اضغطي على خانة ممتلئة لإزالتها.',
      opts: ['الفصل من الخدمة', 'الإنذار', 'الحسم من الراتب', 'اللوم'], ans: [1, 3, 2, 0],
      note: 'الترتيب الصحيح: الإنذار، ثم اللوم، ثم الحسم من الراتب، ثم الفصل من الخدمة.' },
    { type: 'single', q: 'لماذا يجب على الموظف الحفاظ على سرية المعلومات؟',
      opts: ['لأن الزملاء يطلبون ذلك', 'لأن إفشاءها مسؤولية قانونية وأخلاقية وقد يعرّضه لعقوبات تصل إلى الفصل',
             'لأنها تزيد من راتبه'], ans: [1],
      note: 'إفشاء المعلومات السرية مسؤولية قانونية وأخلاقية، وفيه حماية لبيانات المستفيدين.' },
    { type: 'multi', q: 'كيف يسهم التزام الموظف بواجباته في تحقيق رؤية المملكة 2030؟', hint: 'اختاري إجابتين',
      opts: ['رفع كفاءة الأداء الحكومي', 'تأخير إنجاز المعاملات', 'بناء ثقة المواطنين', 'تقليل الشفافية في التعاملات'],
      ans: [0, 2], note: 'الالتزام بالواجبات يرفع كفاءة الأداء الحكومي ويبني ثقة المواطنين ويدعم التحول الرقمي.' }
  ];

  var qs = document.getElementById('qs');
  var fill = document.getElementById('fill');
  var count = document.getElementById('count');
  var warn = document.getElementById('warn');
  var btnCheck = document.getElementById('check');
  var btnRetry = document.getElementById('retry');
  var result = document.getElementById('result');
  var state, locked;

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function answered(i) {
    var q = Q[i], a = state[i];
    return q.type === 'order' ? a.length === q.opts.length : a.length > 0;
  }
  function progress() {
    var n = 0;
    for (var i = 0; i < Q.length; i++) if (answered(i)) n++;
    fill.style.width = (n / Q.length * 100) + '%';
    count.textContent = ar(n) + ' من ' + ar(Q.length);
  }

  function build() {
    state = Q.map(function () { return []; });
    locked = false;
    qs.innerHTML = '';
    Q.forEach(function (q, i) {
      var card = document.createElement('section');
      card.className = 'card';
      card.id = 'card' + i;
      var text = esc(q.q);
      if (q.blank) text = text.replace('____', '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
      var h = '<div class="qhead"><span class="num">' + ar(i + 1) + '</span><p class="qtext">' + text + '</p></div>';
      if (q.hint) h += '<p class="hint">' + esc(q.hint) + '</p>';
      if (q.type === 'order') {
        h += '<div class="order"><ol class="slots" id="slots' + i + '"></ol><div class="pool" id="pool' + i + '"></div></div>';
      } else {
        h += '<div class="opts">';
        q.opts.forEach(function (o, j) {
          var multi = q.type === 'multi';
          h += '<label class="opt' + (multi ? ' multi' : '') + '" id="o' + i + '_' + j + '"><input type="' + (multi ? 'checkbox' : 'radio') +
               '" name="q' + i + '" value="' + j + '"><span class="mark"></span><span class="txt">' + esc(o) + '</span></label>';
        });
        h += '</div>';
      }
      h += '<div id="fb' + i + '"></div>';
      card.innerHTML = h;
      qs.appendChild(card);
      if (q.type === 'order') renderOrder(i);
    });
    qs.addEventListener('change', onChange);
    progress();
    warn.textContent = '';
    result.hidden = true;
    btnCheck.hidden = false;
    btnRetry.hidden = true;
  }

  function onChange(e) {
    if (locked || !e.target.name) return;
    var i = parseInt(e.target.name.slice(1), 10);
    var inputs = qs.querySelectorAll('input[name="q' + i + '"]');
    var sel = [];
    inputs.forEach(function (el) { if (el.checked) sel.push(parseInt(el.value, 10)); });
    state[i] = sel;
    progress();
    warn.textContent = '';
  }

  function renderOrder(i) {
    var q = Q[i], ord = state[i];
    var slots = document.getElementById('slots' + i);
    var pool = document.getElementById('pool' + i);
    slots.innerHTML = ''; pool.innerHTML = '';
    for (var s = 0; s < q.opts.length; s++) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'slot' + (ord[s] !== undefined ? ' filled' : '');
      b.id = 'slot' + i + '_' + s;
      var label = ord[s] !== undefined ? esc(q.opts[ord[s]]) : '&nbsp;';
      var end = s === 0 ? 'الأخف' : (s === q.opts.length - 1 ? 'الأشد' : '');
      b.innerHTML = '<span class="n">' + ar(s + 1) + '</span><span>' + label + '</span><span class="end">' + end + '</span>';
      (function (pos) {
        b.addEventListener('click', function () {
          if (locked || state[i][pos] === undefined) return;
          state[i].splice(pos, 1);
          renderOrder(i); progress(); warn.textContent = '';
        });
      })(s);
      li.appendChild(b);
      slots.appendChild(li);
    }
    q.opts.forEach(function (o, j) {
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'chip'; c.textContent = o;
      c.disabled = ord.indexOf(j) !== -1;
      c.addEventListener('click', function () {
        if (locked) return;
        state[i].push(j);
        renderOrder(i); progress(); warn.textContent = '';
      });
      pool.appendChild(c);
    });
  }

  function isRight(i) {
    var q = Q[i], a = state[i];
    if (q.type === 'order') return a.length === q.ans.length && a.every(function (v, k) { return v === q.ans[k]; });
    var x = a.slice().sort().join(','), y = q.ans.slice().sort().join(',');
    return x === y;
  }

  function check() {
    for (var i = 0; i < Q.length; i++) {
      if (!answered(i)) {
        warn.textContent = 'أجيبي عن السؤال ' + ar(i + 1) + ' أولاً.';
        document.getElementById('card' + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
    }
    locked = true;
    var score = 0;
    Q.forEach(function (q, i) {
      var ok = isRight(i);
      if (ok) score++;
      var card = document.getElementById('card' + i);
      card.classList.add('locked', ok ? 'is-ok' : 'is-bad');
      if (q.type === 'order') {
        q.ans.forEach(function (optIdx, pos) {
          var s = document.getElementById('slot' + i + '_' + pos);
          s.classList.add(state[i][pos] === optIdx ? 'right' : 'wrong');
        });
        document.querySelectorAll('#pool' + i + ' .chip').forEach(function (c) { c.disabled = true; });
      } else {
        q.opts.forEach(function (o, j) {
          var el = document.getElementById('o' + i + '_' + j);
          el.querySelector('input').disabled = true;
          var isAns = q.ans.indexOf(j) !== -1, picked = state[i].indexOf(j) !== -1;
          if (isAns) el.classList.add('right');
          else if (picked) el.classList.add('wrong');
        });
      }
      var fb = document.getElementById('fb' + i);
      fb.innerHTML = '<p class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'إجابة صحيحة. ' : 'إجابة غير صحيحة. ') + '</b>' + esc(q.note) + '</p>';
    });
    document.getElementById('who').textContent = 'نتيجتك';
    document.getElementById('score').textContent = ar(score) + ' / ' + ar(Q.length);
    document.getElementById('msg').textContent = score >= 7 ? 'ممتاز، أحسنتِ!' : (score >= 5 ? 'جيد، راجعي الأسئلة التي أخطأتِ فيها.' : 'راجعي السلايدات ثم حاولي مرة أخرى.');
    var d = '';
    try { d = new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) {}
    document.getElementById('when').textContent = d;
    result.hidden = false;
    btnCheck.hidden = true;
    btnRetry.hidden = false;
    warn.textContent = '';
    result.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  btnCheck.addEventListener('click', check);
  btnRetry.addEventListener('click', function () {
    build();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  build();
})();
</script>

</body></html>
